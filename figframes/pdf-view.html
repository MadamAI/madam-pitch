<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}canvas{display:block;width:100%}</style></head>
<body>
<div id="status">loading…</div>
<canvas id="c"></canvas>
<script type="module">
  import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  const doc = await pdfjs.getDocument('../uploads/Madam One-Pager.pdf').promise;
  const page = await doc.getPage(1);
  const vp = page.getViewport({ scale: 1.2 });
  const c = document.getElementById('c');
  c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  document.getElementById('status').textContent = 'done ' + doc.numPages + ' pages';
</script>
</body>
</html>
