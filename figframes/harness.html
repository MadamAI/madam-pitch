<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fig-tokens.css" />
<link rel="stylesheet" href="fig-assets.css" />
<style>
  html,body{ margin:0; padding:0; background:#fff; }
  #scaler{ position:absolute; top:0; left:0; transform:scale(0.63); transform-origin:top left; }
  #stage{ width:393px; height:852px; overflow:hidden; position:relative; background:#fff; }
  #stage > *{ position:absolute; top:0; left:0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="Components.bundle.js"></script>
</head>
<body>
  <div id="scaler"><div id="stage"></div></div>
  <script>
    const root = ReactDOM.createRoot(document.getElementById('stage'));
    const frames = { jars: window.JarsOwned, detail: window.JarDetailView, home: window.Home3 };
    function cleanup(){
      const stage = document.getElementById('stage');
      stage.querySelectorAll('svg').forEach(svg=>{
        const r = svg.getBoundingClientRect();
        const p = svg.querySelector('path');
        const fill = p ? getComputedStyle(p).fill : '';
        const black = fill==='rgb(0, 0, 0)' || fill==='rgba(0, 0, 0, 1)';
        // wide status bar -> hide
        if(r.width>250 && r.top<110){ svg.style.visibility='hidden'; return; }
        // failed image fills rendered as black paths
        if(black && r.width>=40){
          svg.style.visibility='hidden';
          const wrap = svg.parentElement;
          wrap.style.background = '#E9E4DA';
          const cs = getComputedStyle(wrap);
          if(parseFloat(cs.borderRadius)<8 && r.width<100) wrap.style.borderRadius='999px';
        }
      });
    }
    window.showFrame = function(name){
      root.render(React.createElement(frames[name]));
      setTimeout(cleanup, 300);
    };
    window.showFrame('detail');
  </script>
</body>
</html>
